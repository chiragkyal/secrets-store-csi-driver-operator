design_finding: >-
  tokenRequests.type is a one-way, CEL-enforced transition on the singleton
  ClusterCSIDriver -- once "Managed" it can never revert to "Unmanaged" for the
  rest of the e2e run. This means T7_3 and T7_4 are NOT actually safely
  parallel/order-independent for the "Unmanaged"-dependent scenarios, contrary
  to the "Parallel OK: Yes" annotation in tasks.md/plan.md. Resolved by wiring
  T7_3's Managed-audience calls after an explicit comment marker in hack/e2e.sh,
  flagging that T7_4's Unmanaged-preservation scenarios must be inserted BEFORE
  this block (requiring a reorder, not just an append, when T7_4 lands).
