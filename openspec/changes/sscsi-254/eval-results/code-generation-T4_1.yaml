design_decision:
  choice: "interval formatted as '<seconds>s' rather than time.Duration.String()"
  rationale: >-
    time.Duration.String() renders exactly 120s as '2m0s', not the hardcoded '2m'
    in assets/node.yaml. '<N>s' parses identically to '2m' via Go's duration
    parser, so this is functionally identical but not byte-identical to today's
    default. Documented for T5_1's regression tests to assert resolved-duration
    equivalence rather than exact string match.
