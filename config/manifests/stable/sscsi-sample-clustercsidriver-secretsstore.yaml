apiVersion: console.openshift.io/v1
kind: ConsoleYAMLSample
metadata:
  name: secrets-store-csi-clustercsidriver-secretsstore
spec:
  targetResource:
    apiVersion: operator.openshift.io/v1
    kind: ClusterCSIDriver
  title: Example ClusterCSIDriver - Secret rotation and WIF token audiences
  description: |
    An example ClusterCSIDriver configuration for the Secrets Store CSI driver,
    demonstrating a custom secret rotation interval and workload identity
    federation (WIF) token audiences for AWS and Azure.
  yaml: |
    apiVersion: operator.openshift.io/v1
    kind: ClusterCSIDriver
    metadata:
      name: secrets-store.csi.k8s.io
    spec:
      managementState: Managed
      driverConfig:
        driverType: SecretsStore
        secretsStore:
          secretRotation:
            type: Custom
            custom:
              minimumRefreshAge: 120
          tokenRequests:
            type: Managed
            managed:
              audiences:
              - audience: sts.amazonaws.com
                expirationSeconds: 3600
              - audience: api://AzureADTokenExchange
